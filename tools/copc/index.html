<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALS Downloader · COPC preview prototype</title>
<style>body{font:16px system-ui;background:#101c25;color:#e5eef2;max-width:1100px;margin:30px auto;padding:20px}input{width:95%;padding:12px}button{padding:10px;margin:12px 8px 12px 0}canvas{width:100%;height:65vh;background:#081015}p{line-height:1.5}</style>
<h1>COPC preview prototype</h1><p>Read a coarse 3D sample directly from a public COPC source. Up to 16 MiB of point-cloud requests, 100,000 displayed points. No complete tile download. This experimental tool is separate from the released Shiny viewer.</p>
<label for="url">Public HTTPS COPC URL (check the dataset's reuse terms)</label><input id="url" type="url" autocomplete="off">
<button id="load">Preview partial cloud</button><button id="cancel">Cancel</button><p id="status" role="status">The source must support HTTP ranges and browser CORS.</p>
<canvas id="als-cloud" tabindex="0" aria-label="Point cloud. Drag to rotate, scroll to zoom."></canvas>
<script>window.handlers={};window.Shiny={addCustomMessageHandler:(name,fn)=>handlers[name]=fn};</script>
<script src="/inst/app/www/preview.js"></script><script src="viewer.js"></script></html>
