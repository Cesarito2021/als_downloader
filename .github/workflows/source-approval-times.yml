name: Source approval times
on:
  push:
    branches: [main]
    paths: ["tools/approval_metrics.py", ".github/workflows/source-approval-times.yml"]
  issues:
    types: [labeled, unlabeled, closed, reopened]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: source-approval-times
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate observed approval times
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/approval_metrics.py
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/APPROVAL_TIMES.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update observed source approval times"
          git pull --rebase origin main
          git push origin HEAD:main
